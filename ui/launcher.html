<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>ALttP Tracker Launcher</title>
<style>
  :root {
    --bg: #15171b; --card: #1d2025; --line: #2c3038; --fg: #e3e5e8; --muted: #8f949c;
    --accent: #1da674; --accent-fg: #7fe0b8; --chip: #262a31;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--fg); font: 13px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  main { max-width: 640px; margin: 0 auto; padding: 18px 18px 90px; display: flex; flex-direction: column; gap: 14px; }
  h1 { font-size: 17px; margin: 0; letter-spacing: 0.2px; }
  .sub { color: var(--muted); margin-top: 2px; }
  section { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
  section h2 { font-size: 13px; margin: 0; text-transform: uppercase; letter-spacing: 0.6px; color: var(--muted); font-weight: 600; }
  .seg { display: flex; background: #111317; border: 1px solid var(--line); border-radius: 6px; padding: 3px; gap: 3px; }
  .seg button { flex: 1; border: none; background: transparent; color: var(--muted); padding: 6px 8px; border-radius: 4px; font: inherit; cursor: pointer; }
  .seg button.on { background: var(--chip); color: var(--fg); box-shadow: inset 0 0 0 1px var(--accent); }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { background: var(--chip); border: 1px solid var(--line); border-radius: 999px; padding: 2px 9px; font-size: 12px; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .note { color: var(--muted); font-size: 12px; }
  button.btn { background: #262a31; color: var(--fg); border: 1px solid var(--line); border-radius: 6px; padding: 6px 12px; font: inherit; cursor: pointer; }
  button.btn:hover { background: #30353e; }
  button.btn:disabled { opacity: 0.5; cursor: default; }
  button.primary { background: #17583f; border-color: var(--accent); color: #dff7ec; font-weight: 600; }
  button.primary:hover { background: #1b6a4b; }
  input[type=text], textarea { width: 100%; background: #111317; color: var(--fg); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; font: inherit; }
  textarea { height: 64px; resize: vertical; font: 11px ui-monospace, Menlo, monospace; word-break: break-all; }
  input:focus, textarea:focus { outline: none; border-color: var(--accent); }
  details summary { cursor: pointer; color: var(--muted); font-size: 12px; }
  details[open] summary { margin-bottom: 6px; }
  .flash { animation: flash 1.6s ease-out; }
  @keyframes flash { from { box-shadow: 0 0 0 2px var(--accent); } to { box-shadow: 0 0 0 0 transparent; } }
  footer { position: fixed; left: 0; right: 0; bottom: 0; background: rgba(21, 23, 27, 0.96); border-top: 1px solid var(--line); padding: 12px 18px; }
  footer .inner { max-width: 640px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  label.check { display: flex; gap: 6px; align-items: center; color: var(--muted); cursor: pointer; }
  [hidden] { display: none !important; }
  .head { display: flex; align-items: center; gap: 8px; }
  .head h2 { color: var(--fg); text-transform: none; letter-spacing: 0; font-size: 14px; }
  .sub2 { color: var(--muted); font-size: 12px; }
  .tag { margin-left: auto; font-size: 11px; color: var(--muted); border: 1px solid var(--line); border-radius: 999px; padding: 1px 8px; }
  button.primary-soft { border-color: var(--accent); color: var(--accent-fg); }
  label.check.strong { color: var(--fg); }
</style>
</head>
<body>
<main>
  <h1>ALttP Tracker</h1>

  <section id="muffinsCard">
    <div class="head">
      <h2>Muffins tracker</h2>
    </div>
    <div class="seg" id="muffinsSite">
      <button data-site="classic">Classic</button>
      <button data-site="v2">2.0</button>
    </div>
    <div class="chips" id="flags"></div>
    <div class="row">
      <button class="btn primary-soft" id="muffinsChange" title="Cmd+U from the main window">New seed settings…</button>
    </div>
    <details>
      <summary>Tracker URL</summary>
      <textarea id="trackerUrl" spellcheck="false"></textarea>
      <div class="row" style="margin-top:6px"><button class="btn" data-save="tracker">Save URL</button><button class="btn" data-reset="tracker">Reset to default</button></div>
    </details>
  </section>

  <section id="timerCard">
    <div class="head">
      <h2>Stats tracker</h2>
      <span class="sub2">Stonks timer</span>
    </div>
    <div class="row">
      <button class="btn" id="timerChange">Change stats…</button>
    </div>
    <details>
      <summary>Stats tracker URL</summary>
      <textarea id="timerUrl" spellcheck="false"></textarea>
      <div class="row" style="margin-top:6px"><button class="btn" data-save="timer">Save URL</button><button class="btn" data-reset="timer">Reset to default</button></div>
    </details>
  </section>

  <section id="raceCard">
    <div class="head">
      <h2>Racetime</h2>
    </div>
    <label class="check strong"><input type="checkbox" id="showRace"> Show race room</label>
    <input type="text" id="raceUrl" spellcheck="false" placeholder="racetime.gg/alttpr/room-name">
  </section>
</main>

<footer>
  <div class="inner">
    <label class="check"><input type="checkbox" id="showLauncher"> Open launcher on start</label>
    <button class="btn primary" id="launch">Launch</button>
  </div>
</footer>

<script>
  const $ = (id) => document.getElementById(id);
  let state = null;

  function render(s) {
    state = { ...(state || {}), ...s };
    const st = state;
    $('showRace').checked = st.showRace;
    $('flags').replaceChildren(...st.flags.map((t) => Object.assign(document.createElement('span'), { className: 'chip', textContent: t })));
    document.querySelectorAll('#muffinsSite button').forEach((b) => b.classList.toggle('on', b.dataset.site === st.muffinsSite));
    if (document.activeElement !== $('trackerUrl')) $('trackerUrl').value = st.urls.tracker;
    if (document.activeElement !== $('timerUrl')) $('timerUrl').value = st.urls.timer;
    if (document.activeElement !== $('raceUrl')) $('raceUrl').value = st.urls.race;
    $('showLauncher').checked = st.showLauncher;
    $('launch').textContent = st.running ? 'Relaunch' : 'Launch';
    if (s.flash) {
      const card = s.flash === 'muffins' ? $('muffinsCard') : $('timerCard');
      card.classList.remove('flash'); void card.offsetWidth; card.classList.add('flash');
    }
  }

  api.on('launcher-state', render);
  api.invoke('launcher-state').then(render);

  $('showRace').onchange = () => api.send('set-option', 'showRace', $('showRace').checked);
  $('muffinsChange').onclick = () => api.send('open-site-launcher', 'muffins');
  document.querySelectorAll('#muffinsSite button').forEach((b) => b.onclick = () => api.send('set-option', 'muffinsSite', b.dataset.site));
  $('timerChange').onclick = () => api.send('open-site-launcher', 'timer');
  document.querySelectorAll('[data-save]').forEach((b) => b.onclick = () => api.send('set-url', b.dataset.save, $(b.dataset.save + 'Url').value));
  document.querySelectorAll('[data-reset]').forEach((b) => b.onclick = () => api.send('set-url', b.dataset.reset, state.defaults[b.dataset.reset]));
  const saveRace = () => api.send('set-url', 'race', $('raceUrl').value);
  $('raceUrl').addEventListener('change', saveRace);
  $('raceUrl').addEventListener('keydown', (e) => { if (e.key === 'Enter') $('raceUrl').blur(); });
  $('showLauncher').onchange = () => api.send('set-option', 'showLauncher', $('showLauncher').checked);
  $('launch').onclick = () => {
    if (document.activeElement === $('raceUrl')) saveRace();
    api.send('launch');
  };
</script>
</body>
</html>
